workflows:
  android-build:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract and Build AAB
        script: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -maxdepth 4 -name "gradlew" | head -n 1))
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - "**/build/outputs/bundle/release/*.aab"
      
