workflows:
  android-build:
    name: Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip project files
        script: |
          unzip -o *.zip
      - name: Build Android App Bundle (.aab)
        script: |
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      
